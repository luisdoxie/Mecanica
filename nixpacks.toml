[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo",
  "php82Extensions.pdo_pgsql",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "php82Extensions.bcmath",
  "php82Extensions.fileinfo",
  "php82Extensions.tokenizer",
  "php82Extensions.openssl",
  "php82Extensions.curl",
  "composer",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan event:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan optimize && frankenphp run --config /app/Caddyfile"
